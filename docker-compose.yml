# AMConnect POC: CKAN as the unified data portal, GeoServer + PostGIS as the WebGIS backend.
#
#   portal tier : ckan, db (PostgreSQL), solr, redis
#   GIS tier    : geoserver, postgis, geoserver-seed (one-shot publisher)
#
# GeoNode is deliberately absent.  It would slot in as a third tier next to
# the GIS tier (its own Django app + DB) and CKAN would keep pointing at WMS
# URLs -- see README "Where GeoNode would fit".

services:
  # ------------------------------------------------------------ portal tier
  ckan:
    build: ./ckan
    depends_on:
      db: { condition: service_healthy }
      solr: { condition: service_healthy }
      redis: { condition: service_healthy }
      mock-ckan: { condition: service_started }
      pycsw: { condition: service_started }
      # the CKAN seed derives each dataset's spatial extent from GeoServer's GetCapabilities,
      # so the layers must be published before CKAN starts (first boot only; restarts are free)
      geoserver-seed: { condition: service_completed_successfully }
    ports:
      - "${CKAN_PORT}:5000"
    environment:
      CKAN_SITE_URL: ${CKAN_SITE_URL}
      CKAN_SQLALCHEMY_URL: postgresql://${CKAN_DB_USER}:${CKAN_DB_PASSWORD}@db/${CKAN_DB_NAME}
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/0
      CKAN_SYSADMIN_NAME: ${CKAN_SYSADMIN_NAME}
      CKAN_SYSADMIN_PASSWORD: ${CKAN_SYSADMIN_PASSWORD}
      CKAN_SYSADMIN_EMAIL: ${CKAN_SYSADMIN_EMAIL}
      CKAN__PLUGINS: image_view text_view resource_proxy envvars spatial_metadata spatial_query harvest geo_view geojson_view amconnect amconnect_wms_view amconnect_ckan_harvester amconnect_csw_harvester
      CKAN__VIEWS__DEFAULT_VIEWS: image_view text_view amconnect_wms_view
      # ckanext-spatial: index the real geometry in Solr (needs the -spatial solr image);
      # "solr-bbox" would work with the plain image but only indexes the envelope.
      CKANEXT__SPATIAL__SEARCH_BACKEND: solr-spatial-field
      CKANEXT__SPATIAL__COMMON_MAP__TYPE: custom
      CKANEXT__SPATIAL__COMMON_MAP__CUSTOM__URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      CKANEXT__SPATIAL__COMMON_MAP__ATTRIBUTION: "&copy; OpenStreetMap contributors"
      # ckanext-harvest: job queue on the redis we already run
      CKAN__HARVEST__MQ__TYPE: redis
      CKAN__HARVEST__MQ__HOSTNAME: redis
      # ckanext-geoview: which resource formats the OpenLayers viewer offers itself for
      CKANEXT__GEOVIEW__OL_VIEWER__FORMATS: wms wfs geojson kml gml
      CKANEXT__GEOVIEW__OL_VIEWER__HIDE_OVERLAYS: "false"
      CKAN__SITE_TITLE: AMConnect POC
      CKAN__AUTH__CREATE_USER_VIA_WEB: "false"
      # consumed by `ckan amconnect seed` and the service-capability probes
      CKANEXT__AMCONNECT__GEOSERVER_PUBLIC_URL: ${GEOSERVER_PUBLIC_URL}     # as seen from the browser (stored in resources)
      CKANEXT__AMCONNECT__GEOSERVER_INTERNAL_URL: http://geoserver:8080/geoserver   # as seen from the CKAN container
      CKANEXT__AMCONNECT__GEOSERVER_WORKSPACE: amconnect
      CKANEXT__AMCONNECT__DATA_DIR: /amconnect-data
      AMCONNECT_SEED: "true"
      AMCONNECT_HARVEST: "true"     # run the two demo harvest sources once at start (best effort)
    volumes:
      - ckan_storage:/var/lib/ckan
      # live-edit the extension without rebuilding (templates/JS pick up on restart)
      - ./ckan/ckanext-amconnect:/srv/app/src/ckanext-amconnect
      # drop folder: the seed command reads the *.json sidecars to create datasets
      - ./geoserver/data:/amconnect-data:ro
      # harvest sources are registered by `ckan amconnect seed`
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CKAN_DB_USER}
      POSTGRES_PASSWORD: ${CKAN_DB_PASSWORD}
      POSTGRES_DB: ${CKAN_DB_NAME}
    volumes:
      - ckan_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CKAN_DB_USER} -d ${CKAN_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  solr:
    image: ckan/ckan-solr:2.11-solr9-spatial   # adds spatial_geom (JTS) + bbox fields for ckanext-spatial
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/"]
      interval: 10s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------- GIS tier
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGIS_DB}
      POSTGRES_USER: ${POSTGIS_USER}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER} -d ${POSTGIS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  geoserver:
    image: docker.osgeo.org/geoserver:2.26.2
    depends_on:
      postgis: { condition: service_healthy }
    ports:
      - "${GEOSERVER_PORT}:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"          # lets the CKAN map read GetCapabilities / GetFeatureInfo
      EXTRA_JAVA_OPTS: -Xms256m -Xmx1g
    volumes:
      - geoserver_data:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/geoserver/rest/about/version.json -u ${GEOSERVER_ADMIN_USER}:${GEOSERVER_ADMIN_PASSWORD} >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
    restart: unless-stopped

  geoserver-seed:
    build: ./geoserver/seed
    depends_on:
      postgis: { condition: service_healthy }
      geoserver: { condition: service_healthy }
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      POSTGIS_HOST: postgis
      POSTGIS_DB: ${POSTGIS_DB}
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
    volumes:
      - ./geoserver/data:/data:ro
      - ./geoserver/styles:/styles:ro
    restart: "no"

  # ------------------------------------------ federation test sources (harvest demo)
  # Two tiny local stand-ins for remote catalogues, so the harvest lifecycle can be
  # exercised without depending on an unstable public service.
  mock-ckan:
    # a "remote CKAN" (ASEAN member-state catalogue) = 2 read-only API actions
    image: python:3.12-alpine
    command: ["python", "/app/server.py"]
    environment:
      PORT: "5001"
    volumes:
      - ./harvest-sources/mock-ckan:/app:ro
    ports:
      - "${MOCK_CKAN_PORT:-5001}:5001"
    restart: unless-stopped

  pycsw:
    # a "remote SDI" = CSW 2.0.2 catalogue with ISO 19139 records (pycsw)
    image: geopython/pycsw:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rm -f /tmp/pycsw-records.db &&
        /venv/bin/pycsw-admin.py setup-repository -c /etc/pycsw/pycsw.yml &&
        /venv/bin/pycsw-admin.py load-records -c /etc/pycsw/pycsw.yml -p /records -r &&
        exec /venv/bin/python3 /usr/local/bin/entrypoint.py
    volumes:
      - ./harvest-sources/pycsw/pycsw.yml:/etc/pycsw/pycsw.yml:ro
      - ./harvest-sources/pycsw/records:/records:ro
    ports:
      - "${PYCSW_PORT:-8001}:8000"
    restart: unless-stopped

volumes:
  ckan_storage:
  ckan_db:
  solr_data:
  postgis_data:
  geoserver_data:
