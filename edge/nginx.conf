# Single public origin for the POC: CKAN at /, GeoServer at /geoserver/.
# Point ngrok (or any TLS terminator) at this container's port 80 and set
# PUBLIC_BASE_URL in .env to the public address; CKAN resources, GetCapabilities
# hrefs and the GIS view then all use the same origin (no CORS, no mixed content).
server {
    listen 80;
    client_max_body_size 200m;

    # ngrok / TLS terminators tell us the original scheme; default to the request scheme
    set $fwd_proto $scheme;
    if ($http_x_forwarded_proto != "") { set $fwd_proto $http_x_forwarded_proto; }

    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://ckan:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
