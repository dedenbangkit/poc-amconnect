{% ckan_extends %}

{% block package_additional_info %}
  {% for field in h.amconnect_dataset_fields() %}
    {% if pkg_dict[field.name] %}
      <tr>
        <th scope="row" class="dataset-label">{{ _(field.label) }}</th>
        <td class="dataset-details">{{ pkg_dict[field.name] }}</td>
      </tr>
    {% endif %}
  {% endfor %}
  {{ super() }}
{% endblock %}
