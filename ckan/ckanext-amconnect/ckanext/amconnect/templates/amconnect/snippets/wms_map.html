{#
  Shared OpenLayers WMS map.
  layers: list of {name, url, layer}   (url = WMS base URL without GetMap params)
  height: css height, e.g. '500px'
#}
{% set height = height or '520px' %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
{% asset 'amconnect/wms-map' %}
{% asset 'amconnect/wms-map-css' %}
<div class="amconnect-wms-map" data-module="amconnect-wms-map"
     data-layers='{{ h.dump_json(layers) }}' style="height: {{ height }}">
  <div class="amconnect-wms-map__controls">
    {% for l in layers %}
      <label><input type="checkbox" checked data-layer-index="{{ loop.index0 }}"> {{ l.name }}
        <small class="text-muted">({{ l.layer }})</small></label>
    {% endfor %}
    <span class="amconnect-wms-map__tools">
      <button type="button" class="btn btn-default btn-xs" data-action="select-area"
              title="{{ _('Draw a rectangle to compute summary statistics for the top visible layer') }}">
        <i class="fa fa-square-o"></i> {{ _('Select area (stats)') }}</button>
      <button type="button" class="btn btn-default btn-xs" data-action="clear" hidden>{{ _('Clear') }}</button>
    </span>
  </div>
  <div class="amconnect-wms-map__canvas"></div>
  <div class="amconnect-wms-map__info" hidden></div>
</div>
